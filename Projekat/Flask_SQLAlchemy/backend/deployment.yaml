version: '3'

services:
  database:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3307:3306"
    
  adminer:
    image: adminer
    ports:
      - "8080:8080"

  application:
    image: backend-app
    environment:
      - DATABASE_URL=database
      - PRODUCTION=true
    ports:
      - "5000:5000"