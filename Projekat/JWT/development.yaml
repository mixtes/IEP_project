version: "3"

volumes:
  database_data:

services:
  database:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3307:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - database_data:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - "8080:8080"
